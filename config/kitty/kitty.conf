background_opacity  0.8
background_blur     30

remember_window_size  no
initial_window_width  720
initial_window_height 500

window_margin_width 0
window_padding_width 4

hide_window_decorations no
macos_titlebar_color background
macos_show_window_title_in window
# macos_show_window_title_in none

#: Font {{{

font_family      Input Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

adjust_line_height 4
disable_ligatures never

# 中文及常用标点符号
symbol_map U+3000-U+303F,U+4E00-U+9FFF,U+3400-U+4DBF PingFang SC

# Set i - Set-i Icons
symbol_map U+E5FA-U+E6B2 JetBrainsMono Nerd Font

# Devicons
symbol_map U+E700-U+E7C5 JetBrainsMono Nerd Font

# Font Awesome / Font Awesome Extension
symbol_map U+F000-U+F2E0,U+E200-U+E2A9 JetBrainsMono Nerd Font

# Material Design Icons
symbol_map U+F500-U+FD46 JetBrainsMono Nerd Font

# Weather Icons
symbol_map U+E300-U+E3EB JetBrainsMono Nerd Font

# Octicons
symbol_map U+F400-U+F4A9,U+2665,U+26A1,U+F27C JetBrainsMono Nerd Font

# Powerline Symbols & Extra
symbol_map U+E0A0-U+E0A2,U+E0B0-U+E0B3,U+E0A3,U+E0B4-U+E0C8,U+E0CC-U+E0D4 JetBrainsMono Nerd Font

# Font Linux
symbol_map U+F300-U+F32D JetBrainsMono Nerd Font

# Font Power Symbols
symbol_map U+23FB-U+23FE,U+2B58 JetBrainsMono Nerd Font

# Pomicons
symbol_map U+E000-U+E00D JetBrainsMono Nerd Font

# Codicons (VS Code 图标)
symbol_map U+EA60-U+EBEB JetBrainsMono Nerd Font

# Heavy Angle Brackets / Misc Code Point Fixes
symbol_map U+21B5,U+25B8,U+2605,U+2630,U+2632,U+2714,U+E615,U+E62B JetBrainsMono Nerd Font

#: }}}

cursor_shape block
shell_integration no-cursor
mouse_hide_wait 3.0

copy_on_select yes
confirm_os_window_close 0

enabled_layouts splits, stack

map cmd+\ launch --location=vsplit
map cmd+shift+\ launch --location=hsplit
