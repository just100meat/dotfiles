font_family      Input Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
adjust_line_height 4
disable_ligatures never

# Chinese and CJK punctuation
symbol_map U+3000-U+303F,U+4E00-U+9FFF,U+3400-U+4DBF PingFang SC
# Private Use Area: common Nerd Font icon sets
symbol_map U+E000-U+E00D,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3EB,U+E5FA-U+E6B2,U+E700-U+E7C5,U+EA60-U+EBEB JetBrainsMono Nerd Font
# Font Awesome, Material Design Icons, Octicons, and related symbols
symbol_map U+F000-U+F2E0,U+F300-U+F32D,U+F400-U+F4A9,U+F500-U+FD46 JetBrainsMono Nerd Font
# Common symbols
symbol_map U+23FB-U+23FE,U+25B8,U+2605,U+2630,U+2632,U+2665,U+26A1,U+2B58,U+2714 JetBrainsMono Nerd Font

background_opacity  0.8
background_blur     30

remember_window_size  no
initial_window_width  720
initial_window_height 500
window_margin_width 0
window_padding_width 2.0

cursor_shape block
shell_integration no-cursor
mouse_hide_wait 3.0

copy_on_select yes
confirm_os_window_close 0

macos_titlebar_color
macos_show_window_title_in none
macos_quit_when_last_window_closed yes

map cmd+\ launch --location=vsplit
map cmd+shift+\ launch --location=hsplit
